<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidérea — Problema con el pago</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #F1EDE4;
    color: #211D1A;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }

  .wrap {
    max-width: 40ch;
  }

  .title {
    margin: 0 0 16px;
    font-family: 'Bodoni Moda', Didot, 'Bodoni MT', serif;
    font-weight: 400;
    font-size: clamp(22px, 4vw, 30px);
    line-height: 1.3;
  }

  .message {
    margin: 0;
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 13px;
    line-height: 1.75;
    color: #5D5548;
  }
</style>
</head>
<body>
  <div class="wrap">
    <p class="title">Hubo un problema con tu pago</p>
    <p class="message">{{ message }}</p>
  </div>
</body>
</html>
